            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;

            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        #game-wrapper {
            position: relative;
            width: 800px;
            max-width: 100vw;
            height: 600px;
            max-height: 100vh;
            background: #000;
            border: 2px solid var(--accent);
            border-radius: 12px;
            box-shadow: 0 0 30px var(--accent-glow);
            overflow: hidden;

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* UI Overlays */
        .hud {
            position: absolute;
            top: 12px;
            left: 12px;
            right: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(17, 24, 39, 0.85);
            padding: 10px 16px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(4px);
            pointer-events: none;
        }

        .fragments-hud {
            display: flex;
            gap: 6px;
        }

        .frag-icon {
            width: 22px;
            height: 22px;
            border: 1px dashed var(--text-muted);
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            font-weight: bold;
            color: var(--text-muted);
        }

        .frag-icon.active {
            background: var(--accent);
            border-color: var(--accent);
            color: #000;
            box-shadow: 0 0 8px var(--accent);
        }

        /* Modal Interactivo */
        .modal {
            position: absolute;
            inset: 0;
            background: rgba(9, 13, 22, 0.92);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 24px;
            z-index: 10;
            backdrop-filter: blur(6px);
        }

        .modal.active {
            display: flex;
        }

        .modal-card {
            background: var(--panel-bg);
            border: 2px solid var(--primary);
            border-radius: 12px;
            width: 100%;
            max-width: 620px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(56, 189, 248, 0.2);
        }

        .modal-title {
            color: var(--primary);
            font-size: 1.25rem;
            margin-bottom: 8px;
        }

        .modal-desc {
            font-size: 0.95rem;
            color: var(--text-main);
            margin-bottom: 16px;
            line-height: 1.4;
        }

        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 16px;
        }

        .opt-btn {
            background: #1f2937;
            color: var(--text-main);
            border: 1px solid #374151;
            padding: 12px;
            border-radius: 6px;
            text-align: left;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s;
        }

        .opt-btn:hover {
            background: #374151;
            border-color: var(--primary);
        }

        .hint-box {
            background: rgba(56, 189, 248, 0.1);
            border-left: 4px solid var(--primary);
            padding: 10px;
            margin-bottom: 12px;
            font-size: 0.85rem;
            color: #bae6fd;
            display: none;
        }

        .action-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .btn {
            background: var(--accent);
            color: #000;
            border: none;
            padding: 10px 18px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
        }

        .btn-hint {
            background: transparent;
            color: var(--primary);
            border: 1px solid var(--primary);
        }

        .feedback-msg {
            margin-top: 10px;
            font-weight: bold;
            font-size: 0.9rem;
            min-height: 20px;
        }

        /* Controls Overlay for Mobile */
        .mobile-controls {
            position: absolute;
            bottom: 12px;
            left: 12px;
            right: 12px;
            display: flex;
            justify-content: space-between;
            pointer-events: none;
        }

        .dpad, .action-btn-container {
            pointer-events: auto;
        }

        .dpad {
            display: grid;
            grid-template-columns: repeat(3, 40px);
            grid-template-rows: repeat(3, 40px);
            gap: 4px;
        }

        .dpad button {
            background: rgba(31, 41, 55, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            border-radius: 6px;
            font-weight: bold;
        }

        .interact-btn {
            background: var(--accent);
            color: #000;
            border: none;
            padding: 15px 20px;
            border-radius: 50%;
            font-weight: bold;
            box-shadow: 0 0 10px var(--accent-glow);
        }

        /* Prompt Text */
        .prompt-interact {
            position: absolute;
            bottom: 70px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--accent);
            color: #000;
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.85rem;
            box-shadow: 0 0 12px var(--accent);
            display: none;
            animation: pulse 1s infinite alternate;
        }

        @keyframes pulse {
            from { transform: translateX(-50%) scale(1); }
            to { transform: translateX(-50%) scale(1.05); }
        }
    </style>
</head>

        <button class="btn-action" id="btnInteract">⚡ INTERACTUAR</button>
    </div>

    <!-- Modal de Desafío de Terminal -->
    <div class="modal-overlay" id="quizModal">
        <div class="modal-card">
            <h3 class="modal-title" id="modalTitle">Terminal 1</h3>
            <p class="modal-desc" id="modalDesc">Cargando datos del nodo...</p>
            <div id="modalOptions"></div>
            
            <button class="btn-secondary" onclick="toggleHint()">💡 Pista Interactiva</button>
            <div class="hint-box" id="modalHint"></div>
            
            <div class="feedback-text" id="modalFeedback"></div>
            <button class="btn-close" onclick="closeModal()">Cerrar Terminal</button>
        </div>
    </div>

    <!-- Modal Final de Victoria -->
    <div class="modal-overlay" id="winModal">
        <div class="modal-card" style="text-align: center; border-color: var(--accent);">
            <h2 style="color: var(--accent); margin-top: 0;">🎉 ¡FIREWALL RESTAURADO!</h2>
            <p>Has superado las 5 cámaras y restablecido los valores de Carga Nuclear Efectiva ($Z_{eff}$) en el centro de cómputo.</p>
            <div style="background: #0f172a; padding: 15px; border-radius: 8px; margin: 15px 0; border: 1px solid var(--accent);">
                <span style="font-size: 0.85rem; color: var(--text-muted); display: block;">CLAVE DE RECUPERACIÓN FINAL</span>
                <strong style="font-size: 1.4rem; color: var(--accent); letter-spacing: 2px;">Z_EFF-CORE-SUCCESS-2026</strong>
            </div>
            <p style="font-size: 0.85rem; color: var(--text-muted);">
                Síntesis: La comprensión del apantallamiento $S$ y la atracción nuclear neta permitió reconfigurar las bases de datos de hardware y reciclaje electrónico.
            </p>
            <button class="btn-action" onclick="resetGame()">Reiniciar Misión</button>
        </div>
    </div>
</div>

<script>
    // --- AUDIO API (Efectos de sonido sintetizados) ---
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playBeep(freq, type, duration) {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
    }

    // --- CONFIGURACIÓN DEL JUEGO ---
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // Jugador (Avatar 2D)
    const player = {
        x: 400,
        y: 430,
        size: 18,
        speed: 3.5,
        color: '#10b981'
    };

    // Teclas presionadas
    const keys = { w: false, a: false, s: false, d: false, ArrowUp: false, ArrowLeft: false, ArrowDown: false, ArrowRight: false };

    // Nodos / Terminales en la sala de servidores
    const terminals = [
        { id: 0, code: 'α', name: "Cámara 1: Apantallamiento y Núcleo", x: 150, y: 120, cleared: false,
          desc: "¿Cómo afecta el incremento de electrones en las capas internas (efecto pantalla) a la carga nuclear efectiva (Z_eff) sobre el electrón de valencia exterior?",
          options: [
            { text: "Aumenta la atracción debido a la mayor masa nuclear total.", correct: false },
            { text: "Disminuye la atracción neta porque los electrones internos repelen al electrón externo.", correct: true },
            { text: "No genera ninguna alteración en la fuerza de atracción atómica.", correct: false }
          ],
          hint: "Imagina las capas internas como un escudo físico que amortigua la fuerza directa del núcleo positivo."
        },
        { id: 1, code: 'β', name: "Cámara 2: Variación en la Tabla Periódica", x: 650, y: 120, cleared: false,
          desc: "Al desplazarse de izquierda a derecha a lo largo de un mismo periodo, ¿qué ocurre con la Z_eff y el radio atómico de los semiconductores?",
          options: [
            { text: "Aumenta la Z_eff y disminuye el radio atómico.", correct: true },
            { text: "Disminuye la Z_eff y aumenta el radio atómico.", correct: false },
            { text: "La Z_eff permanece idéntica en todo el periodo.", correct: false }
          ],
          hint: "Se agregan protones al núcleo sin añadir nuevas capas internas de apantallamiento."
        },
        { id: 2, code: 'γ', name: "Cámara 3: Datos y Ficha Técnica de Materiales", x: 150, y: 320, cleared: false,
          desc: "Al comparar metales de transición de hardware (Cobre y Níquel), ¿qué parámetro determina cuál retiene sus electrones con mayor firmeza?",
          options: [
            { text: "Aquel que posea menor número atómico Z.", correct: false },
            { text: "Aquel con mayor valor de Z_eff calculado mediante Z_eff = Z - S.", correct: true },
            { text: "El tamaño total del cristal metálico independientemente de Z_eff.", correct: false }
          ],
          hint: "Calcula la carga nuclear efectiva restando la constante de apantallamiento S a la carga nuclear Z."
        },
        { id: 3, code: 'δ', name: "Cámara 4: Residuos Electrónicos (E-Waste)", x: 650, y: 320, cleared: false,
          desc: "En el reciclaje químico de e-waste, ¿cómo influye una baja Z_eff en la reactividad de los metales recuperados?",
          options: [
            { text: "Facilita la pérdida de electrones (menor energía de ionización).", correct: true },
            { text: "Impide totalmente la disolución o reacción del metal.", correct: false },
            { text: "Aumenta infinitamente la atracción atómica del material.", correct: false }
          ],
          hint: "A menor Z_eff, menor es el agarre del núcleo sobre los electrones exteriores."
        },
        { id: 4, code: 'Ω', name: "Cámara 5: Desafío de Síntesis Avanzada", x: 400, y: 180, cleared: false,
          desc: "¿Por qué los electrones de orbitales d y f ejercen un apantallamiento (S) deficiente en comparación con los orbitales s y p?",
          options: [
            { text: "Por su geometría espacial difusa y baja capacidad de penetración al núcleo.", correct: true },
            { text: "Porque tienen carga eléctrica positiva en lugar de negativa.", correct: false },
            { text: "Porque siempre están fuera de la estructura del átomo.", correct: false }
          ],
          hint: "La forma espacial de las funciones de onda d y f influye en su eficacia para blindar el núcleo."
        }
    ];

    // Obstáculos de la sala (Servidores y Paredes)
    const obstacles = [
        { x: 280, y: 80, w: 240, h: 40 },  // Servidor Central Norte
        { x: 280, y: 360, w: 240, h: 40 }, // Servidor Central Sur
        { x: 50,  y: 200, w: 60,  h: 80 },  // Rack Oeste
        { x: 690, y: 200, w: 60,  h: 80 }   // Rack Este
    ];

    let activeTerminal = null;

    // --- EVENTOS DE TECLADO ---
    window.addEventListener('keydown', e => {
        if (keys.hasOwnProperty(e.key)) keys[e.key] = true;
        if (e.key === ' ' || e.key === 'e' || e.key === 'E') interact();
    });

    window.addEventListener('keyup', e => {
        if (keys.hasOwnProperty(e.key)) keys[e.key] = false;
    });

    // --- CONTROLES TÁCTILES / BOTONES ---
    function bindBtn(id, keyName) {
        const btn = document.getElementById(id);
        const start = (e) => { e.preventDefault(); keys[keyName] = true; };
        const end = (e) => { e.preventDefault(); keys[keyName] = false; };
        btn.addEventListener('touchstart', start);
        btn.addEventListener('touchend', end);
        btn.addEventListener('mousedown', start);
        btn.addEventListener('mouseup', end);
    }
    bindBtn('btnUp', 'w');
    bindBtn('btnDown', 's');
    bindBtn('btnLeft', 'a');
    bindBtn('btnRight', 'd');
    document.getElementById('btnInteract').addEventListener('click', interact);

    // --- LÓGICA DE MOVIMIENTO Y COLISIONES ---
    function updatePlayer() {
        let dx = 0, dy = 0;
        if (keys.w || keys.ArrowUp) dy -= player.speed;
        if (keys.s || keys.ArrowDown) dy += player.speed;
        if (keys.a || keys.ArrowLeft) dx -= player.speed;
        if (keys.d || keys.ArrowRight) dx += player.speed;

        // Normalizar diagonal
        if (dx !== 0 && dy !== 0) {
            dx *= 0.7071;
            dy *= 0.7071;
        }

        let nextX = player.x + dx;
        let nextY = player.y + dy;

        // Colisión con límites del mapa (Canvas)
        if (nextX < player.size) nextX = player.size;
        if (nextX > canvas.width - player.size) nextX = canvas.width - player.size;
        if (nextY < player.size) nextY = player.size;
        if (nextY > canvas.height - player.size) nextY = canvas.height - player.size;

        // Colisión con obstáculos (Racks)
        for (let obs of obstacles) {
            if (nextX + player.size > obs.x && nextX - player.size < obs.x + obs.w &&
                nextY + player.size > obs.y && nextY - player.size < obs.y + obs.h) {
                // Bloquear paso
                return;
            }
        }

        player.x = nextX;
        player.y = nextY;
    }

    // --- INTERACCIÓN CON TERMINALES ---
    function interact() {
        if (activeTerminal !== null) return;

        // Buscar terminal cercano
        for (let t of terminals) {
            let dist = Math.hypot(player.x - t.x, player.y - t.y);
            if (dist < 45) {
                openTerminalModal(t);
                playBeep(600, 'sine', 0.15);
                return;
            }
        }
    }

    function openTerminalModal(t) {
        activeTerminal = t;
        document.getElementById('modalTitle').innerText = `${t.name} [Código: ${t.code}]`;
        document.getElementById('modalDesc').innerText = t.desc;
        document.getElementById('modalHint').innerText = t.hint;
        document.getElementById('modalHint').style.display = 'none';
        document.getElementById('modalFeedback').innerText = '';

        const optionsBox = document.getElementById('modalOptions');
        optionsBox.innerHTML = '';

        if (t.cleared) {
            optionsBox.innerHTML = `<p style="color: var(--accent); font-weight: bold;">✔ Este nodo ya ha sido recuperado e integrado al firewall.</p>`;
        } else {
            t.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = opt.text;
                btn.onclick = () => checkAnswer(idx);
                optionsBox.appendChild(btn);
            });
        }

        document.getElementById('quizModal').style.display = 'flex';
    }

    function checkAnswer(idx) {
        if (!activeTerminal) return;
        const feedback = document.getElementById('modalFeedback');
        if (activeTerminal.options[idx].correct) {
            activeTerminal.cleared = true;
            feedback.style.color = "var(--accent)";
            feedback.innerText = "¡RESPUESTA CORRECTA! Fragmento desencriptado.";
            playBeep(880, 'triangle', 0.25);

            // Actualizar HUD
            document.getElementById(`frag-${activeTerminal.id}`).classList.add('active');

            setTimeout(() => {
                closeModal();
                checkWinCondition();
            }, 1200);
        } else {
            feedback.style.color = "var(--danger)";
            feedback.innerText = "❌ Falla de validación. Analiza el apantallamiento y vuelve a intentarlo.";
            playBeep(180, 'sawtooth', 0.3);
        }
    }

    function toggleHint() {
        const hint = document.getElementById('modalHint');
        hint.style.display = hint.style.display === 'block' ? 'none' : 'block';
    }

    function closeModal() {
        document.getElementById('quizModal').style.display = 'none';
        activeTerminal = null;
    }

    function checkWinCondition() {
        if (terminals.every(t => t.cleared)) {
            setTimeout(() => {
                document.getElementById('winModal').style.display = 'flex';
                playBeep(523.25, 'sine', 0.2);
                setTimeout(() => playBeep(659.25, 'sine', 0.2), 200);
                setTimeout(() => playBeep(783.99, 'sine', 0.4), 400);
            }, 500);
        }
    }

    function resetGame() {
        terminals.forEach(t => t.cleared = false);
        document.querySelectorAll('.hud-fragment').forEach(f => f.classList.remove('active'));
        document.getElementById('winModal').style.display = 'none';
        player.x = 400;
        player.y = 430;
    }

    // --- RENDERIZADO DEL MAPA (CANVAS) ---
    function draw() {
        // Fondo / Rejilla estilo Ciberpunk
        ctx.fillStyle = '#050811';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Dibujar Rejilla
        ctx.strokeStyle = '#1e293b';
        ctx.lineWidth = 1;
        for (let x = 0; x < canvas.width; x += 40) {
            ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
        }
        for (let y = 0; y < canvas.height; y += 40) {
            ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
        }

        // Dibujar Obstáculos (Racks de Servidores)
        obstacles.forEach(obs => {
            ctx.fillStyle = '#1e293b';
            ctx.fillRect(obs.x, obs.y, obs.w, obs.h);
            ctx.strokeStyle = '#334155';
            ctx.strokeRect(obs.x, obs.y, obs.w, obs.h);

            // Luces de servidores
            ctx.fillStyle = '#06b6d4';
            ctx.fillRect(obs.x + 8, obs.y + 8, 12, 4);
            ctx.fillRect(obs.x + 26, obs.y + 8, 12, 4);
        });

        // Dibujar Nodos / Terminales
        terminals.forEach(t => {
            let isNear = Math.hypot(player.x - t.x, player.y - t.y) < 45;

            // Halo interactivo
            ctx.beginPath();
            ctx.arc(t.x, t.y, 24, 0, Math.PI * 2);
            ctx.fillStyle = t.cleared ? 'rgba(16, 185, 129, 0.2)' : (isNear ? 'rgba(6, 182, 212, 0.3)' : 'rgba(239, 68, 68, 0.15)');
            ctx.fill();

            // Terminal físico
            ctx.beginPath();
            ctx.arc(t.x, t.y, 14, 0, Math.PI * 2);
            ctx.fillStyle = t.cleared ? '#10b981' : (isNear ? '#06b6d4' : '#ef4444');
            ctx.fill();
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 2;
            ctx.stroke();

            // Símbolo del nodo
            ctx.fillStyle = '#000';
            ctx.font = 'bold 12px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(t.code, t.x, t.y);

            // Prompt de interacción si está cerca
            if (isNear && !t.cleared) {
                ctx.fillStyle = '#06b6d4';
                ctx.font = 'bold 11px sans-serif';
                ctx.fillText("[ESPACIO / INTERACTUAR]", t.x, t.y - 32);
            }
        });

        // Dibujar Jugador (Avatar Cyber)
        ctx.beginPath();
        ctx.arc(player.x, player.y, player.size, 0, Math.PI * 2);
        ctx.fillStyle = player.color;
        ctx.fill();
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 2;
        ctx.stroke();

        // Visor / Dirección del Jugador
        ctx.fillStyle = '#000';
        ctx.beginPath();
        ctx.arc(player.x, player.y - 3, 5, 0, Math.PI * 2);
        ctx.fill();
    }

    // --- BUCLE PRINCIPAL (GAME LOOP) ---
    function gameLoop() {
        updatePlayer();
        draw();
        requestAnimationFrame(gameLoop);
    }

    gameLoop();
</script>

</body>
</html>
